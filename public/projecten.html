<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bekijk alle uitgevoerde projecten van Gouden Adelaar - Badkamers, keukens, vloeren, schilderwerk en meer.">
    <title>Projecten - Gouden Adelaar Bouw & Renovatie</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Pagina-specifieke stijlen */
        .projects-hero {
            padding: 120px 2rem 60px;
            text-align: center;
            background: var(--dark);
            border-bottom: 1px solid rgba(201,168,76,.1);
        }
        .projects-hero h1 {
            font-family: var(--font-display);
            font-size: 2.8rem;
            color: var(--cream);
        }
        .projects-hero h1 span { color: var(--gold); }
        .projects-hero p {
            color: rgba(245,240,232,.6);
            margin-top: 1rem;
            font-size: 1rem;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 3rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .project-card {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
            aspect-ratio: 4/3;
            background: var(--dark2);
            transition: transform .4s var(--ease-smooth);
        }
        .project-card:hover {
            transform: translateY(-4px);
        }
        .project-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .7s var(--ease-smooth);
        }
        .project-card:hover img {
            transform: scale(1.05);
        }
        .project-card .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10,10,10,.8) 0%, transparent 60%);
            opacity: 0;
            transition: opacity .4s;
        }
        .project-card:hover .overlay { opacity: 1; }
        .project-card .label {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            color: var(--cream);
            font-size: .85rem;
            font-weight: 500;
            transform: translateY(10px);
            opacity: 0;
            transition: all .4s;
        }
        .project-card:hover .label {
            transform: translateY(0);
            opacity: 1;
        }
        .project-card .label span {
            display: block;
            font-size: .65rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--gold);
            margin-top: .25rem;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            color: var(--gold);
            text-decoration: none;
            font-size: .85rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-top: 2rem;
            transition: opacity .3s;
        }
        .back-link:hover { opacity: .7; }
        
        /* Lightbox */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10,10,10,.95);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .lightbox-overlay.open { display: flex; }
        .lightbox-overlay img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
        }
        .lightbox-overlay .close-lb {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            font-size: 2rem;
            color: var(--cream);
            cursor: pointer;
            background: none;
            border: none;
            font-family: var(--font-body);
            transition: color .3s;
        }
        .lightbox-overlay .close-lb:hover { color: var(--gold); }

        @media(max-width:768px) {
            .projects-hero h1 { font-size: 2rem; }
            .projects-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; padding: 1.5rem 1rem; }
        }
        @media(max-width:480px) {
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Simple nav -->
    <nav id="nav" style="position:fixed;top:0;left:0;right:0;z-index:1000;padding:1rem 2rem;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(201,168,76,.15);display:flex;align-items:center;justify-content:space-between">
        <a href="/" style="display:flex;align-items:center;gap:.75rem;text-decoration:none">
            <img src="/img/logo%20(2).png" alt="Gouden Adelaar" style="width:40px;height:40px;object-fit:contain">
            <div style="display:flex;flex-direction:column;line-height:1.1">
                <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:1.2rem;font-weight:600;color:#F5F0E8">Gouden Adelaar</span>
                <span style="font-size:.6rem;font-weight:300;color:#C9A84C;letter-spacing:.15em;text-transform:uppercase">Bouw &amp; Renovatie</span>
            </div>
        </a>
        <a href="/" class="back-link" style="margin:0">← Terug naar home</a>
    </nav>

    <!-- Hero -->
    <div class="projects-hero">
        <h1>Al onze <span>projecten</span></h1>
        <p>Een overzicht van al onze uitgevoerde werkzaamheden — van badkamers tot complete renovaties.</p>
    </div>

    <!-- Grid -->
    <div class="projects-grid" id="projectsGrid"></div>

    <!-- Lightbox -->
    <div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
        <button class="close-lb" onclick="closeLightbox()">&times;</button>
        <img id="lightboxImg" src="" alt="Project foto">
    </div>

    <!-- Footer -->
    <footer class="footer" role="contentinfo" style="border-top:1px solid rgba(201,168,76,.1);padding:2rem;text-align:center;background:var(--dark)">
        <div class="container">
            <p style="font-size:.8rem;color:rgba(245,240,232,.35)">&copy; 2025 Gouden Adelaar Bouw &amp; Renovatie. Alle rechten voorbehouden.</p>
            <a href="/" style="font-size:.75rem;color:var(--gold);text-decoration:none;margin-top:.5rem;display:inline-block">← Terug naar home</a>
        </div>
    </footer>

    <script>
        // Alle fotos - allemaal met algemeen label
        const fotos = [
            // Alle fotos uit img/ (1-17.png + old fotos + foto/ submap)
            { src: '/img/1.png' }, { src: '/img/2.png' }, { src: '/img/3.png' },
            { src: '/img/4.png' }, { src: '/img/5.png' }, { src: '/img/6.png' },
            { src: '/img/7.png' }, { src: '/img/8.png' }, { src: '/img/9.png' },
            { src: '/img/10.png' }, { src: '/img/11.png' }, { src: '/img/12.png' },
            { src: '/img/13.png' }, { src: '/img/14.png' }, { src: '/img/15.png' },
            { src: '/img/16.png' }, { src: '/img/17.png' },
            { src: '/img/old-1.jpg' }, { src: '/img/old-2.jpg' }, { src: '/img/old-3.jpg' },
        ];

        // Voeg fotos uit de foto/ submap toe
        for (let i = 1; i <= 20; i++) {
            fotos.push({ src: '/img/foto/project (' + i + ').jpeg' });
        }

        // Render grid
        const grid = document.getElementById('projectsGrid');
        fotos.forEach((foto, index) => {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.innerHTML = `
                <img src="${foto.src}" alt="Gouden Adelaar project" loading="lazy" onerror="this.parentElement.style.display='none'">
                <div class="overlay"></div>
                <div class="label">
                    <span>Gouden Adelaar</span>
                </div>
            `;
            card.addEventListener('click', () => openLightbox(foto.src));
            grid.appendChild(card);
        });

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxOverlay').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightboxOverlay').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>
</body>
</html>
